  /* ── OPS Portal token ramp (src/app/globals.css, dark theme) ── */
  :root{
    --bg:#0a0c12;--s0:#070910;--s1:#121621;--s2:#1a1f2e;--s3:#20283a;--s4:#2c364e;
    --border:#262f43;--border-strong:#3c4866;--border-subtle:#1c2230;
    --ink:#f0f4fc;--muted:#8e9cb8;--soft:#94a3b8;
    --brand:#0157ff;--brand-300:#669fff;--brand-400:#337fff;--brand-600:#0146cc;
    --ok:#10b981;--ok-300:#6ee7b7;--warn:#f59e0b;--warn-300:#fcd34d;
    --err:#ef4444;--err-300:#fca5a5;--info:#60a5fa;--info-300:#93c5fd;
    --brass:#b89968;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,SFMono-Regular,monospace;
    --sh-luxe:0 8px 32px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
    --sh-luxe-3:0 1px 0 rgba(255,255,255,.06) inset,0 16px 40px -12px rgba(0,0,0,.6);
    --sh-glow:0 0 0 3px rgba(1,87,255,.18);
    --sh-glow-brand:0 0 0 1px rgba(1,87,255,.4),0 8px 24px -6px rgba(1,87,255,.45);
    --sh-well:inset 0 1px 3px rgba(0,0,0,.5);
    --ease-luxe:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;color:var(--ink);font:400 15px/1.6 var(--font);
    font-feature-settings:'cv02','cv03','cv04','cv11';
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    font-synthesis-weight:none;overflow-x:hidden;
    background:var(--bg);
    padding-top:56px;
  }
  /* The portal's first-impression signature — twin brand-blue blooms on a fixed
     underlay (the SignInScreen pattern; background-attachment:fixed glitches
     Chrome's compositor under sticky/backdrop-filter layers). */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(circle at 30% 20%,rgba(1,87,255,.15),transparent 50%),
      radial-gradient(circle at 80% 60%,rgba(1,87,255,.08),transparent 50%),
      var(--bg);
  }
  b,strong,h1,h2,h3,th,button{font-weight:600}
  a{color:var(--brand-300);text-decoration:none}
  button,input,select{font:inherit}
  ::selection{background:#0157FF;color:#fff}
  :focus-visible{outline:2px solid rgba(1,87,255,.85);outline-offset:2px;border-radius:4px;box-shadow:0 0 0 6px rgba(1,87,255,.18)}
  :focus:not(:focus-visible){outline:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 44px}

  /* ── Topbar — fixed glass chrome, straight from the portal shell ── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(10,12,18,.72);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid rgba(38,47,67,.6)}
  .topbar-in{max-width:1180px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
  .topbar img{height:22px;width:auto;display:block}
  .topbar .word{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .topbar nav{display:flex;gap:4px;margin-left:10px;overflow-x:auto;scrollbar-width:none}
  .topbar nav::-webkit-scrollbar{display:none}
  .topbar nav a{font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:10px;white-space:nowrap;transition:color .15s,background .15s}
  .topbar nav a:hover{color:var(--ink);background:rgba(26,31,46,.6)}
  .topbar nav a.on{color:var(--brand-300);background:rgba(1,87,255,.12)}
  .topbar .scope{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}

  .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10.5px;font-weight:600;color:var(--soft)}

  /* ── Hero ── */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding:38px 0 26px}
  .hero h1{font-size:clamp(26px,4vw,34px);line-height:1.15;letter-spacing:-.025em;margin:10px 0 10px;max-width:760px;font-weight:600}
  .hero p{color:var(--muted);margin:0;max-width:700px;font-size:15px}

  /* Stat tiles — luxe cards with the portal's metallic top hairline */
  .snapshot{display:grid;grid-template-columns:repeat(3,minmax(104px,1fr));gap:10px;min-width:340px}
  .snapshot>div{position:relative;background:rgba(18,22,33,.8);background-image:linear-gradient(135deg,rgba(18,22,33,.9),rgba(26,31,46,.5));border:1px solid rgba(38,47,67,.6);border-radius:14px;padding:13px 15px 12px;box-shadow:var(--sh-luxe);backdrop-filter:blur(4px);overflow:hidden}
  .snapshot>div::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background-image:linear-gradient(135deg,#cfd8e5 0%,#8b97ad 60%,#b9c4d4 100%)}
  .snapshot>div:first-child::before{background-image:linear-gradient(135deg,#4a8bff 0%,#0157FF 50%,#0040c0 100%)}
  .snapshot b{display:block;font-size:22px;line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .snapshot span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .lab-snapshot{grid-template-columns:repeat(4,minmax(96px,1fr));min-width:440px}
  .lab-snapshot .retired b{color:var(--muted)}

  /* ── Segmented register switch ── */
  .engine-switch{display:inline-flex;gap:4px;padding:4px;background:var(--s0);border:1px solid var(--border-subtle);border-radius:12px;margin:0 0 18px;box-shadow:var(--sh-well)}
  .engine-switch a{color:var(--muted);font-size:13px;font-weight:600;padding:7px 14px;border:1px solid transparent;border-radius:8px;transition:color .15s,background .15s}
  .engine-switch a:hover{color:var(--ink)}
  .engine-switch a.on{color:var(--ink);background:var(--s2);border-color:rgba(38,47,67,.6);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 6px rgba(0,0,0,.35)}

  /* ── Toolbar — recessed portal inputs ── */
  .toolbar{display:grid;grid-template-columns:minmax(230px,1fr) 200px auto;gap:10px;align-items:center;margin:20px 0 12px}
  .toolbar.lab-toolbar{grid-template-columns:minmax(230px,1fr) 210px 210px auto}
  .toolbar label{min-width:0;position:relative;display:block}
  .search,.filter{background:var(--s0);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:44px;min-width:0;width:100%;box-shadow:var(--sh-well);transition:border-color .15s,box-shadow .15s,background .15s}
  .search::placeholder{color:rgba(148,163,184,.55)}
  .search:focus,.filter:focus{background:var(--s1);border-color:var(--brand)!important;box-shadow:var(--sh-well),0 0 0 2px rgba(1,87,255,.3);outline:none}
  .filter{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border:1px solid var(--border);background:var(--s2);border-radius:6px;font:500 10.5px/1 var(--mono);color:var(--muted);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 1px 0 rgba(0,0,0,.4);pointer-events:none}
  .result-count{font-size:11px;color:var(--muted);text-align:right;min-width:110px;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

  /* ── Luxe card — the portal's core surface ── */
  .card{background:rgba(18,22,33,.8);background-image:linear-gradient(135deg,rgba(18,22,33,.9),rgba(26,31,46,.5));border:1px solid rgba(38,47,67,.6);border-radius:16px;box-shadow:var(--sh-luxe);backdrop-filter:blur(4px)}
  .card.pad{padding:21px 22px}
  .card h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
  .card h3{font-size:10.5px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
  .card p{color:var(--muted);margin:0 0 12px;font-size:13.5px}
  .list-card{padding:0;overflow:hidden}

  /* ── Catalog rows ── */
  .driver-row{display:grid;grid-template-columns:minmax(230px,1.05fr) minmax(300px,1.7fr) minmax(240px,.85fr);gap:24px;align-items:center;padding:18px 20px;color:inherit;transition:background .15s}
  .driver-row+.driver-row,.lab-row+.lab-row{border-top:1px solid rgba(38,47,67,.4)}
  .driver-row:hover,.lab-row:hover{background:rgba(26,31,46,.4)}
  .identity{display:flex;align-items:center;gap:14px;min-width:0}
  .glyph{flex:0 0 44px;width:44px;height:44px;border:1px solid rgba(38,47,67,.6);border-radius:12px;background:var(--s2);display:grid;place-items:center;font:600 15px var(--font);color:var(--brand-300);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;letter-spacing:.02em}
  .identity h2{font-size:15px;line-height:1.3;margin:0 0 2px;letter-spacing:-.01em;color:var(--ink)}
  .slug{font:11px/1.5 var(--mono);color:var(--soft);overflow-wrap:anywhere}
  .promise{color:var(--muted);font-size:13.5px;line-height:1.55}
  .promise p{margin:0 0 9px}
  .mini-features{display:flex;gap:6px;flex-wrap:wrap}
  .mini-features span{font-size:10.5px;color:var(--soft);background:rgba(148,163,184,.12);border-radius:999px;padding:2.5px 9px;font-weight:600}
  .release{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center}
  .release .ver{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .release .ver .xmlv{color:var(--soft);font:500 11px var(--mono)}
  .release small{color:var(--soft);grid-column:1/-1;font-size:11.5px}
  .chev{font-size:18px;color:var(--soft)}

  .lab-row{display:grid;grid-template-columns:minmax(230px,1fr) minmax(280px,1.4fr) minmax(180px,.7fr);gap:24px;align-items:center;padding:18px 20px;color:inherit;transition:background .15s}
  .lab-row h2{font-size:15px;line-height:1.3;margin:0 0 3px;color:var(--ink);letter-spacing:-.01em}
  .lab-row .counts{display:grid;grid-template-columns:repeat(2,minmax(74px,1fr));gap:8px}
  .lab-row .counts div{border-left:1px solid rgba(38,47,67,.6);padding-left:12px}
  .lab-row .counts b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .lab-row .counts span{display:block;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .lab-state{color:var(--muted);font-size:13px;line-height:1.5}
  .lab-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .lab-tag{display:inline-flex;align-items:center;border-radius:999px;background:rgba(148,163,184,.12);color:var(--soft);font-size:10px;font-weight:600;padding:2.5px 9px;text-transform:uppercase;letter-spacing:.05em}
  .lab-tag.retired{color:var(--muted);background:rgba(142,156,184,.08)}

  /* ── Status pills — the portal's StatusPill vocabulary ── */
  .pill{display:inline-flex;align-items:center;gap:5px;width:max-content;border-radius:999px;padding:2.5px 10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
  .pill.good{background:rgba(16,185,129,.15);color:var(--ok-300)}
  .pill.warn{background:rgba(245,158,11,.15);color:var(--warn-300)}
  .pill.bad{background:rgba(239,68,68,.15);color:var(--err-300)}
  .pill.info{background:rgba(96,165,250,.15);color:var(--info-300)}
  .pill.brand{background:rgba(1,87,255,.15);color:var(--brand-300)}
  .pill.muted{background:rgba(148,163,184,.14);color:var(--soft)}

  .empty{border:1px solid rgba(38,47,67,.6);border-radius:16px;background:rgba(18,22,33,.8);padding:48px 24px;text-align:center;color:var(--muted);margin-top:18px;box-shadow:var(--sh-luxe)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600;margin:22px 0 0;transition:color .15s}
  .back:hover{color:var(--ink)}

  /* ── Product head ── */
  .product-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;padding:18px 0 24px;border-bottom:1px solid rgba(38,47,67,.6)}
  .product-head h1{font-size:clamp(26px,4vw,34px);line-height:1.12;letter-spacing:-.025em;margin:9px 0 12px;font-weight:600}
  .product-head p{color:var(--muted);max-width:730px;margin:0}
  .head-actions{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;flex-wrap:wrap}

  /* ── Buttons — portal recipe: 12px radius, 600, scale on press ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(60,72,102,.6);border-radius:12px;color:var(--ink);background:var(--s2);padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px;transition:all .15s;text-decoration:none}
  .btn:hover{border-color:rgba(102,159,255,.5);background:var(--s3)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand);border-color:var(--brand-600);color:#fff;box-shadow:var(--sh-glow-brand)}
  .btn.primary:hover{background:var(--brand-600)}
  .btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.quiet:hover{color:var(--ink);background:rgba(26,31,46,.6)}

  /* ── Spec strip — divided fact grid in a luxe card ── */
  .status-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0;overflow:hidden}
  .status-item{padding:11px 16px;border-left:1px solid rgba(38,47,67,.4);border-top:1px solid rgba(38,47,67,.4);margin:-1px 0 0 -1px}
  .status-item span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:2px}
  .status-item b{font-size:12.5px;font-variant-numeric:tabular-nums}

  /* ── Tabs — portal underline vocabulary ── */
  .tabs{display:flex;gap:18px;overflow:auto;border-bottom:1px solid rgba(38,47,67,.6);margin:22px 0 18px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{appearance:none;background:transparent;border:0;color:var(--muted);padding:4px 2px 11px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;position:relative;transition:color .15s}
  .tab:hover{color:var(--ink)}
  .tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent;border-radius:2px;transition:background .15s}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab[aria-selected="true"]::after{background:var(--brand)}
  .tab-panel[hidden]{display:none}

  .overview-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px}
  .stack{display:grid;gap:16px}

  /* ── Callouts — full border + tint, portal info voice ── */
  .lab-notice{display:grid;grid-template-columns:auto 1fr;gap:13px;background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:15px 17px;margin:18px 0}
  .lab-notice .mark{width:28px;height:28px;border:1px solid var(--info-300);border-radius:50%;display:grid;place-items:center;color:var(--info-300);font-weight:600;font-size:13px}
  .lab-notice b{display:block;font-size:13px}
  .lab-notice p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .lab-notice.retired{background:rgba(148,163,184,.06);border-color:rgba(60,72,102,.6)}
  .lab-notice.retired .mark{border-color:var(--soft);color:var(--soft)}

  .lab-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .lab-card{border:1px solid rgba(38,47,67,.6);background:rgba(26,31,46,.45);border-radius:12px;padding:16px}
  .lab-card h3{font-size:13px;margin:0 0 4px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .lab-card p{color:var(--muted);font-size:12px;line-height:1.55;margin:0}
  .lab-card .lab-meta{font:500 10.5px/1.4 var(--mono);color:var(--brand-300);margin-bottom:8px}
  .lab-card summary{cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:600}
  .lab-card summary:hover{color:var(--ink)}

  .gate-list{display:grid;gap:9px}
  .gate{display:grid;grid-template-columns:36px 1fr;gap:11px;border-top:1px solid rgba(38,47,67,.4);padding-top:11px}
  .gate:first-child{border-top:0;padding-top:0}
  .gate-id{width:34px;height:34px;border:1px solid rgba(60,72,102,.6);background:var(--s2);border-radius:10px;display:grid;place-items:center;color:var(--brand-300);font:600 11px var(--mono)}
  .gate h3{font-size:13px;margin:0 0 2px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .gate p{font-size:12px;margin:0;color:var(--muted)}
  .gate small{display:block;color:var(--soft);font-size:11px;margin-top:5px}

  .source-register{display:grid;gap:0;border-top:1px solid rgba(38,47,67,.4);list-style:none;margin:0;padding:0}
  .source-register li{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid rgba(38,47,67,.4);padding:10px 0;color:var(--soft);font-size:12.5px}
  .source-register .index{color:var(--muted);font:500 10.5px/1.7 var(--mono);min-width:24px}

  .family-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}
  .metric-pair{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(38,47,67,.6);border:1px solid rgba(38,47,67,.6);border-radius:11px;overflow:hidden}
  .metric-pair div{background:var(--s2);padding:12px}
  .metric-pair b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .metric-pair span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

  .checklist,.plain-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .checklist li,.plain-list li{position:relative;padding-left:26px;color:var(--soft);font-size:13.5px}
  .checklist li::before{content:"✓";position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--ok-300);font-size:9px;display:grid;place-items:center}
  .plain-list li::before{content:"—";position:absolute;left:2px;color:var(--muted)}
  .warning-list li::before{content:"!";width:15px;height:15px;border:1px solid rgba(245,158,11,.45);background:rgba(245,158,11,.1);border-radius:50%;font-size:9px;top:3px;color:var(--warn-300);display:grid;place-items:center;left:0}

  .facts{display:grid;gap:0}
  .fact{display:grid;grid-template-columns:minmax(90px,.7fr) minmax(0,1.3fr);gap:12px;padding:9px 0;border-bottom:1px solid rgba(38,47,67,.4);font-size:12.5px}
  .fact:last-child{border-bottom:0}
  .fact span{color:var(--muted)}
  .fact b{font-weight:600;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

  .qa-verdict{display:flex;align-items:center;gap:12px;padding:13px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:12px;margin-bottom:12px}
  .qa-verdict.fail{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25)}
  .qa-verdict.pending{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25)}
  .qa-verdict .mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(16,185,129,.15);color:var(--ok-300);font-weight:600;flex:0 0 34px}
  .qa-verdict.fail .mark{background:rgba(239,68,68,.15);color:var(--err-300)}
  .qa-verdict.pending .mark{background:rgba(245,158,11,.15);color:var(--warn-300)}
  .qa-verdict b{display:block;font-size:13.5px}
  .qa-verdict span{font-size:11px;color:var(--muted)}
  .qa-stage{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid rgba(38,47,67,.4);font-size:12.5px;align-items:center}
  .qa-stage:last-child{border-bottom:0}
  .qa-stage b{font-weight:600}
  .qa-stage small{grid-column:1/-1;color:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}

  .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .shot{margin:0}
  .shot button{appearance:none;width:100%;padding:0;border:1px solid rgba(38,47,67,.6);border-radius:14px;overflow:hidden;background:rgba(18,22,33,.8);cursor:zoom-in;text-align:left;color:var(--ink);transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh-luxe)}
  .shot button:hover{transform:translateY(-2px);border-color:rgba(60,72,102,.8);box-shadow:var(--sh-luxe-3)}
  .shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:var(--s0)}
  .shot figcaption{padding:12px 14px}
  .shot b{display:block;font-size:13px}
  .shot span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

  dialog{border:1px solid var(--border-strong);border-radius:16px;padding:0;background:var(--s1);color:var(--ink);max-width:min(1100px,94vw);max-height:92vh;box-shadow:var(--sh-luxe-3)}
  dialog::backdrop{background:rgba(7,9,16,.82)}
  dialog img{display:block;max-width:100%;max-height:82vh}
  dialog .dialog-bar{display:flex;align-items:center;gap:10px;padding:9px 9px 9px 14px;background:var(--s2);border-bottom:1px solid rgba(38,47,67,.6)}
  dialog .dialog-bar b{font-size:12px}
  dialog .dialog-bar button{margin-left:auto;min-height:32px}

  .doc-frame{width:100%;height:min(76vh,900px);border:1px solid rgba(38,47,67,.6);border-radius:12px;background:#fff}
  .doc-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
  .doc-tools p{margin:0;color:var(--muted);font-size:12px}

  .steps{counter-reset:steps;list-style:none;padding:0;margin:0;display:grid;gap:14px}
  .steps li{counter-increment:steps;display:grid;grid-template-columns:28px 1fr;gap:11px;color:var(--soft);font-size:13.5px}
  .steps li::before{content:counter(steps);width:26px;height:26px;border:1px solid rgba(1,87,255,.35);background:rgba(1,87,255,.1);border-radius:50%;display:grid;place-items:center;color:var(--brand-300);font:600 11px var(--mono)}

  .code-row{display:flex;gap:8px;align-items:center;background:var(--s0);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px;box-shadow:var(--sh-well)}
  .code-row code{font:12px/1.5 var(--mono);color:var(--brand-300);overflow-wrap:anywhere;min-width:0}
  .copy{margin-left:auto;white-space:nowrap;min-height:32px;padding:5px 11px}

  .history{width:100%;border-collapse:collapse}
  .history th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;border-bottom:1px solid rgba(38,47,67,.6);font-weight:600}
  .history td{font-size:12.5px;padding:11px 10px;border-bottom:1px solid rgba(38,47,67,.4);vertical-align:top}
  .history tbody tr{transition:background .15s}
  .history tbody tr:hover{background:rgba(26,31,46,.3)}
  .history tr:last-child td{border-bottom:0}
  .history .mono{font-family:var(--mono);color:var(--muted);font-size:11px}

  /* ── Skeleton loading — the portal never spins, it shimmers ── */
  .skel{position:relative;overflow:hidden;background:rgba(26,31,46,.5);border-radius:8px}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(148,163,184,.08),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
  @keyframes shimmer{100%{transform:translateX(100%)}}
  .skel-row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:18px 20px}
  .skel-row+.skel-row{border-top:1px solid rgba(38,47,67,.4)}

  /* ── Route reveal — one 500ms luxe entrance, staggered ── */
  @keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  #view>*{animation:riseIn .5s var(--ease-luxe) both}
  #view>*:nth-child(2){animation-delay:.04s}
  #view>*:nth-child(3){animation-delay:.08s}
  #view>*:nth-child(4){animation-delay:.12s}
  #view>*:nth-child(5){animation-delay:.16s}
  #view>*:nth-child(n+6){animation-delay:.2s}

  .divider{height:1px;background-image:linear-gradient(90deg,transparent,rgba(38,47,67,.8),transparent);margin-top:52px}
  .powered{padding-top:28px;text-align:center}
  .powered::before{content:"";display:block;width:40px;height:1px;background:var(--brass);margin:0 auto 16px}
  .powered span{display:block;font-size:10px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);padding-left:.34em}
  .powered img{height:30px;margin-top:10px;opacity:.96}
  .places{font:9.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:8px}

  @media(max-width:900px){
    .hero{grid-template-columns:1fr}
    .snapshot{min-width:0;max-width:560px}
    .lab-snapshot{min-width:0}
    .driver-row{grid-template-columns:minmax(220px,1fr) minmax(260px,1.35fr)}
    .release{grid-column:1/-1}
    .lab-row{grid-template-columns:minmax(220px,1fr) minmax(260px,1.35fr)}
    .lab-row .counts{grid-column:1/-1}
    .toolbar.lab-toolbar{grid-template-columns:minmax(230px,1fr) 1fr 1fr}
    .toolbar.lab-toolbar .result-count{grid-column:1/-1;text-align:left}
    .product-head{grid-template-columns:1fr}
    .head-actions{justify-content:flex-start}
    .overview-grid,.family-grid{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .wrap{padding:0 14px 36px}
    .topbar-in{padding:0 14px;gap:10px}
    .topbar .scope{display:none}
    .topbar .word{display:none}
    .hero{padding-top:26px}
    .toolbar,.toolbar.lab-toolbar{grid-template-columns:1fr}
    .result-count,.toolbar.lab-toolbar .result-count{grid-column:auto;text-align:left}
    .driver-row,.lab-row{grid-template-columns:1fr;gap:12px;padding:16px}
    .release,.lab-row .counts{grid-column:auto}
    .chev{display:none}
    .snapshot,.lab-snapshot{grid-template-columns:repeat(2,1fr);width:100%;max-width:none}
    .snapshot b{font-size:19px}
    .shots,.lab-board{grid-template-columns:1fr}
    .card.pad{padding:17px 16px}
    .doc-frame{height:68vh}
    .doc-tools{align-items:flex-start;flex-direction:column}
    .history th:nth-child(3),.history td:nth-child(3),.history th:nth-child(4),.history td:nth-child(4){display:none}
    .engine-switch{display:flex}
    .engine-switch a{flex:1;text-align:center}
  }
  @media(pointer:coarse){.btn,.tab,.topbar nav a,.engine-switch a{min-height:44px;display:inline-flex;align-items:center;justify-content:center}.kbd{display:none}}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    #view>*{animation:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <img src="https://relay.integrateit.dev/app/logo.png" alt="IntegrateIT">
    <span class="word">Ops Portal</span>
    <nav aria-label="Ops Portal">
      <a href="https://relay.integrateit.dev/ops/index.html">Service Requests</a>
      <a href="https://relay.integrateit.dev/ops/licenses.html">Licenses</a>
      <a href="https://relay.integrateit.dev/ops/drivers.html" class="on" aria-current="page">Driver Engine</a>
    </nav>
    <span class="scope">Control4 Driver Engine</span>
  </div>
</header>
<div class="wrap">
  <main id="view" aria-busy="true"><div class="card list-card" style="margin-top:38px">
    <div class="skel-row"><div class="skel" style="width:44px;height:44px;border-radius:12px"></div><div><div class="skel" style="height:14px;width:38%;margin-bottom:8px"></div><div class="skel" style="height:11px;width:64%"></div></div><div class="skel" style="height:22px;width:110px;border-radius:999px"></div></div>
    <div class="skel-row"><div class="skel" style="width:44px;height:44px;border-radius:12px"></div><div><div class="skel" style="height:14px;width:44%;margin-bottom:8px"></div><div class="skel" style="height:11px;width:58%"></div></div><div class="skel" style="height:22px;width:110px;border-radius:999px"></div></div>
    <div class="skel-row"><div class="skel" style="width:44px;height:44px;border-radius:12px"></div><div><div class="skel" style="height:14px;width:32%;margin-bottom:8px"></div><div class="skel" style="height:11px;width:70%"></div></div><div class="skel" style="height:22px;width:110px;border-radius:999px"></div></div>
  </div></main>
  <footer><div class="divider"></div><div class="powered"><span>Powered by</span><img src="https://relay.integrateit.dev/app/logo.png" alt="IntegrateIT"><div class="places">Kansas City · South Florida</div></div></footer>
</div>

<script>

let CHANNEL=PROD_CHANNEL;
if(requestedChannel&&localHost){
  try{const u=new URL(requestedChannel);if(u.origin===location.origin&&/^\/\.brand-assets-cache[^/]*\/control4$/.test(u.pathname))CHANNEL=u.href.replace(/\/$/,'')}catch(_){ }
}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function statusMeta(d){

function hardwareLabel(s){return({'field-validated':'Field validated','bench-tested':'Bench tested','simulation-verified':'Simulation verified','not-tested':'Not hardware tested'})[s]||String(s||'Not recorded').replaceAll('-',' ')}

const channelUrl=url=>CHANNEL!==PROD_CHANNEL&&String(url||'').startsWith(PROD_CHANNEL)?CHANNEL+String(url).slice(PROD_CHANNEL.length):url;

}
async function loadCatalog(){

  try{const c=await getJson(CHANNEL+'/catalog.json');if([2,3].includes(c.schema)&&Array.isArray(c.drivers))return CATALOG=c.drivers.map(normalize)}catch(_){ }

}

function labDataUrl(){return CHANNEL!==PROD_CHANNEL?`${CHANNEL}/lab.json`:`${location.origin}/drivers/lab.json`}
function roadmapStats(data){
  const families=data.families||[],sourceNames=families.flatMap(f=>f.sourceDrivers||[]),familyIds=families.map(f=>f.id),byClass={};
  families.forEach(f=>{if(!Array.isArray(f.sourceDrivers)||f.sourceDrivers.length!==f.sourceDriverCount)throw new Error('Clean-room family reconciliation failed');byClass[f.primaryClass]=(byClass[f.primaryClass]||0)+f.sourceDriverCount});
  if(new Set(familyIds).size!==familyIds.length||new Set(sourceNames).size!==sourceNames.length)throw new Error('Clean-room lab contains duplicate records');
  const audited=sourceNames.length,familyCount=families.length,declaredAudited=data.source?.auditedUniqueEncryptedDrivers,declaredFamilies=data.source?.familyCount;
  if(Number.isInteger(declaredAudited)&&declaredAudited!==audited)throw new Error('Clean-room source reconciliation failed');
  if(Number.isInteger(declaredFamilies)&&declaredFamilies!==familyCount)throw new Error('Clean-room family count reconciliation failed');
  const targets=data.reconciliation?.targetArtifactCounts||{},familyTargetTotal=families.reduce((n,f)=>n+(Number.isInteger(f.targetArtifactCount)?f.targetArtifactCount:0),0),cleanRoomTarget=targets.cleanRoomArtifactsIfAllGatesPass,replacementTarget=targets.newTrademarkNeutralConsoleReplacement;
  if(Number.isInteger(cleanRoomTarget)&&cleanRoomTarget!==familyTargetTotal)throw new Error('Clean-room target reconciliation failed');
  const derivedMaximum=Number.isInteger(cleanRoomTarget)&&Number.isInteger(replacementTarget)?cleanRoomTarget+replacementTarget:familyTargetTotal,maximumPlanned=Number.isInteger(targets.maximumPlannedIntegrateITArtifacts)?targets.maximumPlannedIntegrateITArtifacts:derivedMaximum;
  if(maximumPlanned!==derivedMaximum)throw new Error('Clean-room maximum reconciliation failed');
  const reconciledRetired=data.reconciliation?.classificationCounts?.['do-not-republish'];
  if(Number.isInteger(reconciledRetired)&&reconciledRetired!==(byClass['do-not-republish']||0))throw new Error('Clean-room retired reconciliation failed');
  return{audited,familyCount,maximumPlanned,retired:Number.isInteger(reconciledRetired)?reconciledRetired:(byClass['do-not-republish']||0)};
}

  const render=()=>{const q=$('#lab-search').value.trim().toLowerCase(),cls=$('#lab-class').value,wave=$('#lab-wave').value;const shown=lab.families.filter(f=>(cls==='all'||f.primaryClass===cls)&&(wave==='all'||f.wave===wave)&&[f.name,f.id,...(f.sourceDrivers||[]),...(f.prerequisites||[])].join(' ').toLowerCase().includes(q));$('#lab-catalog').innerHTML=shown.length?`<div class="card list-card">${shown.map(familyRow).join('')}</div>`:'<div class="empty"><b>No matching lab families</b>Clear the search or broaden the provenance and wave filters.</div>';const represented=shown.reduce((n,f)=>n+f.sourceDriverCount,0);$('#lab-count').textContent=`${shown.length} of ${lab.families.length} families · ${represented} audited sources`};

function documentationPanel(d){return`<section class="card pad"><div class="doc-tools"><p>This is the exact self-contained Documentation tab packaged in v${esc(d.version)}.</p>${d.doc_url?`<a class="btn" href="${esc(d.doc_url)}" target="_blank" rel="noopener">Open separately ↗</a>`:''}</div><div id="doc-host"><div class="empty"><b>Loading packaged documentation…</b></div></div></section>`}
function installPanel(d){
  const manifest=d.manifest_url||`${CHANNEL}/${d.slug}/version.json`,updateOs=d.update_min_os||'3.3.1';
  return`<div class="overview-grid"><section class="card pad"><h2>First installation</h2><ol class="steps"><li><div>Download <b>${esc(d.slug)}.c4z</b> and add or update the driver in Composer Pro.</div></li><li><div>Add the driver to the project, then complete the properties and bindings described in Documentation.</div></li><li><div>Enter the IntegrateIT license settings, activate, and run the driver’s validation/test actions before handoff.</div></li></ol><div class="head-actions" style="justify-content:flex-start;margin-top:18px">${downloadAction(d)}<a class="btn" href="${esc(manifest)}" target="_blank" rel="noopener">View update manifest</a></div></section><aside class="stack"><section class="card pad"><h2>Future versions: keep every connection</h2><ol class="steps"><li><div>The installed driver checks the same release channel for a newer version.</div></li><li><div>On Control4 OS <b>${esc(updateOs)}+</b>, run <b>Download &amp; Stage Update</b>. On older supported OS versions, download the new C4Z here instead.</div></li><li><div>In Composer Pro, right-click the existing driver and choose <b>Update Driver</b>. Do not delete or re-add it; properties, bindings, and programming remain attached.</div></li></ol></section><section class="card pad"><h2>Integrity</h2><p>Compare the downloaded package before installation.</p><div class="code-row"><code>sha256 ${esc(d.sha256||'not published')}</code>${d.sha256?'<button class="btn quiet copy" data-copy="hash">Copy</button>':''}</div><div style="margin-top:9px;font:11.5px var(--mono);color:var(--soft)">shasum -a 256 ${esc(d.slug)}.c4z</div></section></aside></div>`;
}
async function releasesPanel(d){let rel=null,cl='';try{rel=await getJson(d.releases_url||`${CHANNEL}/${d.slug}/releases.json`)}catch(_){ }try{cl=await getText(d.changelog_url||`${CHANNEL}/${d.slug}/CHANGELOG.md`)}catch(_){ }const rows=(rel?.history||[]).map(h=>{const tone=h.qa_status==='pass'?'good':h.qa_status==='legacy-unverified'?'muted':'bad';return`<tr><td><b>v${esc(h.version)}</b><div class="mono">xml ${esc(h.xml_version||'?')}</div></td><td>${date(h.published_at)}</td><td>${kb(h.size_bytes)}</td><td>${h.qa_status?`<span class="pill ${tone}">QA ${esc(h.qa_status)}</span>`:''}<div style="margin-top:5px;color:var(--soft);font-size:11.5px">${esc(hardwareLabel(h.hardware_status))}</div></td><td>${esc(h.notes||'')}</td><td><a class="btn quiet" href="${CHANNEL}/${encodeURIComponent(d.slug)}/releases/${encodeURIComponent(h.version)}/${encodeURIComponent(d.slug)}.c4z" download>Download</a></td></tr>`}).join('');return`<section class="card pad"><h2>Immutable release history</h2>${rows?`<div style="overflow:auto"><table class="history"><thead><tr><th>Version</th><th>Published</th><th>Size</th><th>Evidence</th><th>Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p>No version history is published yet.</p>'}${cl?`<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Raw changelog</summary><pre style="white-space:pre-wrap;color:var(--muted);font:11.5px/1.6 var(--mono)">${esc(cl)}</pre></details>`:''}</section>`}
const TAB_LABELS={overview:'Overview',screenshots:'Screenshots',documentation:'Documentation',releases:'Release history',install:'Install & update'};
async function driverView(slug,active='overview'){
  const ds=await loadCatalog(),d=ds.find(x=>x.slug===slug);if(!d){$('#view').innerHTML=`<a class="back" href="#">← Driver Engine</a>${engineSwitch('releases')}<div class="empty"><b>Driver not found</b>${esc(slug)} is not in the live release channel.</div>`;return}
  if(!TAB_LABELS[active])active='overview';const s=statusMeta(d);
  $('#view').innerHTML=`<a class="back" href="#">← All drivers</a><section class="product-head"><div><div class="eyebrow">${esc(d.category&&!/^others?$/i.test(d.category)?d.category:'Control4 driver')}</div><h1>${esc(d.name||d.slug)}</h1><p>${esc(d.summary||'')}</p></div><div class="head-actions">${downloadAction(d,true)}${d.doc_url?`<a class="btn" href="#/driver/${encodeURIComponent(d.slug)}/documentation">Documentation</a>`:''}</div></section>
    <div class="card status-strip"><div class="status-item"><span>Release</span><b style="color:${s.tone==='good'?'var(--ok-300)':s.tone==='warn'?'var(--warn-300)':'var(--muted)'}">${esc(s.label)}</b></div><div class="status-item"><span>Version</span><b>v${esc(d.version)} · xml ${esc(d.xml_version)}</b></div><div class="status-item"><span>Control4</span><b>OS ${esc(d.min_os)}+</b></div><div class="status-item"><span>Hardware</span><b>${esc(hardwareLabel(d.hardware_status))}</b></div><div class="status-item"><span>License</span><b>${esc(d.license||'IntegrateIT license')}</b></div><div class="status-item"><span>Published</span><b>${date(d.published_at)}</b></div></div>
    <div class="tabs" role="tablist" aria-label="Driver information">${Object.entries(TAB_LABELS).map(([id,label])=>`<button id="tab-${id}" class="tab" role="tab" aria-controls="tab-panel" aria-selected="${id===active}" tabindex="${id===active?'0':'-1'}" data-tab="${id}">${label}${id==='screenshots'&&d.screenshots.length?` (${d.screenshots.length})`:''}</button>`).join('')}</div><div id="tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-${active}"></div>`;
  const show=async id=>{
    const request=++PANEL_REQUEST;
    history.replaceState(null,'',`${location.pathname}${location.search}#/driver/${encodeURIComponent(d.slug)}/${id}`);
    document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===id;t.setAttribute('aria-selected',String(on));t.setAttribute('tabindex',on?'0':'-1')});
    const p=$('#tab-panel');p.setAttribute('aria-labelledby',`tab-${id}`);
    p.innerHTML=id==='overview'?overview(d):id==='screenshots'?screenshotPanel(d):id==='documentation'?documentationPanel(d):id==='install'?installPanel(d):'<div class="empty"><b>Loading release history…</b></div>';
    if(id==='documentation')await loadDoc(d,request);
    if(id==='releases'){const html=await releasesPanel(d);if(request!==PANEL_REQUEST)return;p.innerHTML=html}
    if(request!==PANEL_REQUEST)return;
    bindPanel(d);
  };
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>show(t.dataset.tab));
    t.addEventListener('keydown',e=>{
      const tabs=[...document.querySelectorAll('.tab')];let n=null,i=tabs.indexOf(t);
      if(e.key==='ArrowRight')n=(i+1)%tabs.length;
      else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home')n=0;
      else if(e.key==='End')n=tabs.length-1;
      if(n!=null){e.preventDefault();tabs[n].focus();show(tabs[n].dataset.tab)}
    });
  });
  await show(active);
}
async function loadDoc(d,request){const host=$('#doc-host');if(!d.doc_url){host.innerHTML='<div class="empty"><b>Documentation not published</b></div>';return}try{const html=await getText(d.doc_url);if(request!==PANEL_REQUEST)return;const frame=document.createElement('iframe');frame.className='doc-frame';frame.title=`${d.name} packaged documentation`;frame.setAttribute('sandbox','');frame.referrerPolicy='no-referrer';frame.srcdoc=html;host.replaceChildren(frame)}catch(_){if(request===PANEL_REQUEST)host.innerHTML='<div class="empty"><b>Could not load documentation</b>Use “Open separately” or try again.</div>'}}
function bindPanel(d){document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('click',()=>{const s=d.screenshots[Number(b.dataset.shot)],dlg=$('#lightbox');$('#lightbox-title').textContent=s.title;$('#lightbox-image').src=s.url;$('#lightbox-image').alt=s.alt;dlg.showModal()}));const copy=document.querySelector('[data-copy="hash"]');if(copy)copy.addEventListener('click',async()=>{let ok=false;try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(d.sha256);ok=true}catch(_){try{const ta=document.createElement('textarea');ta.value=d.sha256;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(_){ }}copy.textContent=ok?'Copied':'Copy failed';setTimeout(()=>copy.textContent='Copy',1400)})}
$('#lightbox-close').addEventListener('click',()=>$('#lightbox').close());$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});
addEventListener('keydown',e=>{
  if(e.key!=='/'||e.metaKey||e.ctrlKey||e.altKey)return;
  const t=document.activeElement,tag=t?.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||t?.isContentEditable)return;
  const box=$('#search')||$('#lab-search');
  if(box){e.preventDefault();box.focus()}
});
async function route(){
  const request=++ROUTE_REQUEST;PANEL_REQUEST++;
  const driver=location.hash.match(/^#?\/driver\/([^/]+)(?:\/([^/]+))?\/?$/),family=location.hash.match(/^#?\/lab\/([^/]+)\/?$/),lab=/^#?\/lab\/?$/.test(location.hash);
  const view=$('#view');view.setAttribute('aria-busy','true');
  try{
    if(driver){await loadCatalog();if(request!==ROUTE_REQUEST)return;await driverView(decodeURIComponent(driver[1]),driver[2]||'overview')}
    else if(family){await loadLab();if(request!==ROUTE_REQUEST)return;await labFamilyView(decodeURIComponent(family[1]))}
    else if(lab){await loadLab();if(request!==ROUTE_REQUEST)return;await labView()}
    else{await loadCatalog();if(request!==ROUTE_REQUEST)return;await catalogView()}
  }catch(e){if(request===ROUTE_REQUEST)$('#view').innerHTML=`<div class="empty" style="margin-top:38px"><b>Could not reach the Driver Engine register</b>The release channel or clean-room lab record is unavailable. Check the connection and reload this page.<div style="margin-top:16px"><a class="btn" href="${esc(location.href)}">Try again</a></div></div>`}
  finally{if(request===ROUTE_REQUEST)view.removeAttribute('aria-busy')}
}
addEventListener('hashchange',route);route();document.querySelector('.topbar nav a.on')?.scrollIntoView({inline:'nearest',block:'nearest'});
</script>
</body>
</html>
