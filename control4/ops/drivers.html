<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>IntegrateIT — Driver Engine</title>
<style>

  }
  *{box-sizing:border-box}

  button,a,input,select{outline:none}

  .identity h2{font-size:17px;line-height:1.25;margin:0 0 2px;letter-spacing:-.01em}.slug{font:11px/1.4 var(--mono);color:var(--mut2);overflow-wrap:anywhere}
  .promise{color:var(--mut);font-size:13.5px;line-height:1.55}.promise p{margin:0 0 9px}.mini-features{display:flex;gap:6px;flex-wrap:wrap}

  .tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin:22px 0 18px;scrollbar-width:thin}

  .section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:21px 22px}.section h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}.section h3{font-size:11px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);}.section p{color:var(--mut);margin:0 0 12px}
  .lab-notice{display:grid;grid-template-columns:auto 1fr;gap:13px;background:rgba(127,178,255,.055);border:1px solid rgba(127,178,255,.28);border-radius:13px;padding:15px 17px;margin:18px 0}.lab-notice .mark{width:28px;height:28px;border:1px solid var(--blue2);border-radius:50%;display:grid;place-items:center;color:var(--blue2);font-weight:850}.lab-notice b{display:block;font-size:13px}.lab-notice p{margin:2px 0 0;color:var(--mut);font-size:12.5px}.lab-notice.retired{background:rgba(167,178,195,.045);border-color:var(--line)}.lab-notice.retired .mark{border-color:var(--mut2);color:var(--mut2)}
  .lab-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lab-card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:16px}.lab-card h3{font-size:13px;margin:0 0 4px}.lab-card p{color:var(--mut);font-size:12px;line-height:1.55;margin:0}.lab-card .lab-meta{font:10.5px/1.4 var(--mono);color:var(--blue2);margin-bottom:8px}.gate-list{display:grid;gap:9px}.gate{display:grid;grid-template-columns:36px 1fr;gap:11px;border-top:1px solid var(--line);padding-top:11px}.gate:first-child{border-top:0;padding-top:0}.gate-id{width:34px;height:34px;border:1px solid var(--line2);border-radius:9px;display:grid;place-items:center;color:var(--blue2);font:800 11px var(--mono)}.gate h3{font-size:13px;margin:0 0 2px}.gate p{font-size:12px;margin:0;color:var(--mut)}.gate small{display:block;color:var(--mut2);font-size:11px;margin-top:5px}.source-register{display:grid;gap:0;border-top:1px solid var(--line);list-style:none;margin:0;padding:0}.source-register li{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0;color:#d5deea;font-size:12.5px}.source-register .index{color:var(--mut2);font:10.5px/1.7 var(--mono);min-width:24px}.family-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}.metric-pair{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}.metric-pair div{background:var(--raised);padding:12px}.metric-pair b{display:block;font-size:20px}.metric-pair span{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;font-weight:750}
  .checklist,.plain-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}.checklist li,.plain-list li{position:relative;padding-left:24px;color:#d5deea;font-size:13.5px}.checklist li:before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:850}.plain-list li:before{content:"—";position:absolute;left:0;color:var(--mut2)}
  .warning-list li:before{content:"!";display:grid;place-items:center;width:15px;height:15px;border:1px solid rgba(251,191,36,.5);border-radius:50%;font-size:9px;top:3px;color:var(--warn)}
  .facts{display:grid;gap:0}.fact{display:grid;grid-template-columns:minmax(90px,.7fr) minmax(0,1.3fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}.fact:last-child{border-bottom:0}.fact span{color:var(--mut)}.fact b{font-weight:650;text-align:right;overflow-wrap:anywhere}
  .qa-verdict{display:flex;align-items:center;gap:12px;padding:13px;background:var(--raised);border:1px solid var(--line);border-radius:11px;margin-bottom:12px}.qa-verdict .mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(52,211,153,.1);color:var(--good);font-weight:900}.qa-verdict b{display:block}.qa-verdict span{font-size:11px;color:var(--mut)}
  .qa-stage{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}.qa-stage:last-child{border-bottom:0}.qa-stage b{font-weight:650}.qa-stage span{font-weight:800}.qa-stage small{grid-column:1/-1;color:var(--mut2);font-size:11.5px}
  .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.shot{margin:0}.shot button{appearance:none;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);cursor:zoom-in;text-align:left;color:var(--txt)}.shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:var(--deep)}.shot figcaption{padding:12px 14px}.shot b{display:block;font-size:13px}.shot span{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
  dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--deep);color:var(--txt);max-width:min(1100px,94vw);max-height:92vh}dialog::backdrop{background:rgba(0,0,0,.78)}dialog img{display:block;max-width:100%;max-height:82vh}dialog .dialog-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel)}dialog .dialog-bar b{font-size:12px}dialog .dialog-bar button{margin-left:auto}
  .doc-frame{width:100%;height:min(76vh,900px);border:1px solid var(--line);border-radius:12px;background:#fff}.doc-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.doc-tools p{margin:0;color:var(--mut);font-size:12px}
  .steps{counter-reset:steps;list-style:none;padding:0;margin:0;display:grid;gap:14px}.steps li{counter-increment:steps;display:grid;grid-template-columns:28px 1fr;gap:11px;color:#d5deea;font-size:13.5px}.steps li:before{content:counter(steps);width:28px;height:28px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;color:var(--blue2);font:750 11px var(--mono)}
  .code-row{display:flex;gap:8px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}.code-row code{font:11px/1.5 var(--mono);color:var(--blue2);overflow-wrap:anywhere;min-width:0}.copy{margin-left:auto;white-space:nowrap}
  .history{width:100%;border-collapse:collapse}.history th{text-align:left;color:var(--mut2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;border-bottom:1px solid var(--line)}.history td{font-size:12px;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}.history tr:last-child td{border-bottom:0}.history .mono{font-family:var(--mono);color:var(--mut)}
  .powered{margin-top:46px;padding-top:28px;border-top:1px solid var(--line);text-align:center}.powered:before{content:"";display:block;width:40px;height:1px;background:var(--brass);margin:0 auto 16px}.powered span{display:block;font-size:10px;font-weight:650;letter-spacing:.34em;text-transform:uppercase;color:var(--mut);padding-left:.34em}.powered img{height:32px;margin-top:10px;opacity:.96}
  .places{font:9px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--mut2);margin-top:8px}
  @media(max-width:900px){.hero{grid-template-columns:1fr}.snapshot{max-width:520px}.driver-row{grid-template-columns:minmax(220px,1fr) minmax(260px,1.35fr)}.release{grid-column:1/-1}.lab-row{grid-template-columns:minmax(220px,1fr) minmax(260px,1.35fr)}.lab-row .counts{grid-column:1/-1}.toolbar.lab-toolbar{grid-template-columns:minmax(230px,1fr) 1fr 1fr}.toolbar.lab-toolbar .result-count{grid-column:1/-1;text-align:left}.product-head{grid-template-columns:1fr}.head-actions{justify-content:flex-start}.overview-grid,.family-grid{grid-template-columns:1fr}}
  @media(max-width:640px){body{padding:18px 14px 36px}.mast span{display:none}.toolbar,.toolbar.lab-toolbar{grid-template-columns:1fr}.result-count,.toolbar.lab-toolbar .result-count{grid-column:auto;text-align:left}.driver-row,.lab-row{grid-template-columns:1fr;gap:12px;padding:18px 2px}.release,.lab-row .counts{grid-column:auto}.snapshot,.lab-snapshot{min-width:0;max-width:none;width:100%}.lab-snapshot{grid-template-columns:repeat(2,1fr)}.status-item{min-width:50%;border-bottom:1px solid var(--line)}.shots,.lab-board{grid-template-columns:1fr}.section{padding:18px}.doc-frame{height:68vh}.doc-tools{align-items:flex-start;flex-direction:column}.history th:nth-child(3),.history td:nth-child(3),.history th:nth-child(4),.history td:nth-child(4){display:none}}

<body>
<div class="wrap">
  <header class="mast"><img src="https://relay.integrateit.dev/app/logo.png" alt="IntegrateIT"><b>Ops Portal</b><span>CONTROL4 DRIVER ENGINE</span></header>
  <nav class="portal-nav" aria-label="Ops Portal">
    <a href="https://relay.integrateit.dev/ops/index.html">Service Requests</a>
    <a href="https://relay.integrateit.dev/ops/licenses.html">Licenses</a>
    <a href="https://relay.integrateit.dev/ops/drivers.html" class="on" aria-current="page">Driver Engine</a>
  </nav>
  <main id="view"><div class="empty"><b>Opening the release channel…</b>Reading the exact catalog used by installed drivers.</div></main>
  <footer class="powered"><span>Powered by</span><img src="https://relay.integrateit.dev/app/logo.png" alt="IntegrateIT"><div class="places">Kansas City · South Florida</div></footer>
</div>
<dialog id="lightbox" aria-labelledby="lightbox-title"><div class="dialog-bar"><b id="lightbox-title"></b><button class="btn quiet" id="lightbox-close">Close</button></div><img id="lightbox-image" alt=""></dialog>
<script>
const PROD_CHANNEL='https://raw.githubusercontent.com/Integrateit2026/brand-assets/main/control4';
const requestedChannel=new URLSearchParams(location.search).get('channel');
const localHost=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let CHANNEL=PROD_CHANNEL;
if(requestedChannel&&localHost){
  try{const u=new URL(requestedChannel);if(u.origin===location.origin&&/^\/\.brand-assets-cache[^/]*\/control4$/.test(u.pathname))CHANNEL=u.href.replace(/\/$/,'')}catch(_){ }
}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bust=u=>u+(u.includes('?')?'&':'?')+'t='+Date.now();
const kb=n=>n==null?'—':n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const date=iso=>iso?new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not recorded';
const c4z=d=>d.download_url||`${CHANNEL}/${encodeURIComponent(d.slug)}/${encodeURIComponent(d.slug)}.c4z`;
let CATALOG=null;
let LAB=null;
let PANEL_REQUEST=0;
let ROUTE_REQUEST=0;

async function getJson(url){const r=await fetch(bust(url),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function getText(url){const r=await fetch(bust(url),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text()}
function statusMeta(d){
  const s=d.release_status||'published';
  if(s==='stable')return{label:'Stable',tone:'good'};
  if(s==='release-candidate')return{label:'Release candidate',tone:'warn'};
  if(s==='deprecated')return{label:'Deprecated',tone:'bad'};
  return{label:s.replaceAll('-',' '),tone:'muted'};
}
function hardwareLabel(s){return({'field-validated':'Field validated','bench-tested':'Bench tested','simulation-verified':'Simulation verified','not-tested':'Not hardware tested'})[s]||String(s||'Not recorded').replaceAll('-',' ')}
function qaChecks(qa){return(qa?.stages||[]).reduce((n,s)=>n+(s.checks||s.files||0),0)}
const channelUrl=url=>CHANNEL!==PROD_CHANNEL&&String(url||'').startsWith(PROD_CHANNEL)?CHANNEL+String(url).slice(PROD_CHANNEL.length):url;
const trustedChannelUrl=url=>{try{const base=new URL(CHANNEL+'/'),u=new URL(String(url||''));return u.origin===base.origin&&u.pathname.startsWith(base.pathname)?u.href:null}catch(_){return null}};
function normalize(d){
  const out={features:[],compatibility:[],requirements:[],limitations:[],screenshots:[],stats:{},...d};
  for(const k of ['download_url','manifest_url','changelog_url','doc_url','releases_url','qa_url'])if(out[k])out[k]=trustedChannelUrl(channelUrl(out[k]));
  out.screenshots=(out.screenshots||[]).map(s=>({...s,url:trustedChannelUrl(channelUrl(s.url))})).filter(s=>s.url);
  return out;
}
async function loadCatalog(){
  if(CATALOG)return CATALOG;
  if(!localHost){
    try{const mirror=await getJson(location.origin+'/api/drivers');if(mirror.ok&&Array.isArray(mirror.drivers))return CATALOG=mirror.drivers.map(normalize)}catch(_){ }

  const ds=await loadCatalog(),d=ds.find(x=>x.slug===slug);if(!d){$('#view').innerHTML=`${engineSwitch('releases')}<a class="back" href="#">← Driver Engine</a><div class="empty"><b>Driver not found</b>${esc(slug)} is not in the live release channel.</div>`;return}
  if(!TAB_LABELS[active])active='overview';const s=statusMeta(d);
  $('#view').innerHTML=`${engineSwitch('releases')}<a class="back" href="#">← All drivers</a><section class="product-head"><div><div class="eyebrow">${esc(d.category||'Control4 driver')}</div><h1>${esc(d.name||d.slug)}</h1><p>${esc(d.summary||'')}</p></div><div class="head-actions">${downloadAction(d)}${d.doc_url?`<a class="btn" href="#/driver/${encodeURIComponent(d.slug)}/documentation">Documentation</a>`:''}</div></section>
    <div class="status-strip"><div class="status-item"><span>Release</span><b style="color:${s.tone==='good'?'var(--good)':s.tone==='warn'?'var(--warn)':'var(--mut)'}">${esc(s.label)}</b></div><div class="status-item"><span>Version</span><b>v${esc(d.version)} · xml ${esc(d.xml_version)}</b></div><div class="status-item"><span>Control4</span><b>OS ${esc(d.min_os)}+</b></div><div class="status-item"><span>Hardware</span><b>${esc(hardwareLabel(d.hardware_status))}</b></div><div class="status-item"><span>License</span><b>${esc(d.license||'IntegrateIT license')}</b></div><div class="status-item"><span>Published</span><b>${date(d.published_at)}</b></div></div>
    <div class="tabs" role="tablist" aria-label="Driver information">${Object.entries(TAB_LABELS).map(([id,label])=>`<button id="tab-${id}" class="tab" role="tab" aria-controls="tab-panel" aria-selected="${id===active}" tabindex="${id===active?'0':'-1'}" data-tab="${id}">${label}${id==='screenshots'&&d.screenshots.length?` (${d.screenshots.length})`:''}</button>`).join('')}</div><div id="tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-${active}"></div>`;
  const show=async id=>{
    const request=++PANEL_REQUEST;
    history.replaceState(null,'',`${location.pathname}${location.search}#/driver/${encodeURIComponent(d.slug)}/${id}`);
    document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===id;t.setAttribute('aria-selected',String(on));t.setAttribute('tabindex',on?'0':'-1')});
    const p=$('#tab-panel');p.setAttribute('aria-labelledby',`tab-${id}`);
    p.innerHTML=id==='overview'?overview(d):id==='screenshots'?screenshotPanel(d):id==='documentation'?documentationPanel(d):id==='install'?installPanel(d):'<div class="empty"><b>Loading release history…</b></div>';
    if(id==='documentation')await loadDoc(d,request);
    if(id==='releases'){const html=await releasesPanel(d);if(request!==PANEL_REQUEST)return;p.innerHTML=html}
    if(request!==PANEL_REQUEST)return;
    bindPanel(d);
  };
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>show(t.dataset.tab));
    t.addEventListener('keydown',e=>{
      const tabs=[...document.querySelectorAll('.tab')];let n=null,i=tabs.indexOf(t);
      if(e.key==='ArrowRight')n=(i+1)%tabs.length;
      else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home')n=0;
      else if(e.key==='End')n=tabs.length-1;
      if(n!=null){e.preventDefault();tabs[n].focus();show(tabs[n].dataset.tab)}
    });
  });
  await show(active);
}
async function loadDoc(d,request){const host=$('#doc-host');if(!d.doc_url){host.innerHTML='<div class="empty"><b>Documentation not published</b></div>';return}try{const html=await getText(d.doc_url);if(request!==PANEL_REQUEST)return;const frame=document.createElement('iframe');frame.className='doc-frame';frame.title=`${d.name} packaged documentation`;frame.setAttribute('sandbox','');frame.referrerPolicy='no-referrer';frame.srcdoc=html;host.replaceChildren(frame)}catch(_){if(request===PANEL_REQUEST)host.innerHTML='<div class="empty"><b>Could not load documentation</b>Use “Open separately” or try again.</div>'}}
function bindPanel(d){document.querySelectorAll('[data-shot]').forEach(b=>b.addEventListener('click',()=>{const s=d.screenshots[Number(b.dataset.shot)],dlg=$('#lightbox');$('#lightbox-title').textContent=s.title;$('#lightbox-image').src=s.url;$('#lightbox-image').alt=s.alt;dlg.showModal()}));const copy=document.querySelector('[data-copy="hash"]');if(copy)copy.addEventListener('click',async()=>{let ok=false;try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(d.sha256);ok=true}catch(_){try{const ta=document.createElement('textarea');ta.value=d.sha256;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(_){ }}copy.textContent=ok?'Copied':'Copy failed';setTimeout(()=>copy.textContent='Copy',1400)})}
$('#lightbox-close').addEventListener('click',()=>$('#lightbox').close());$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});
async function route(){
  const request=++ROUTE_REQUEST;PANEL_REQUEST++;
  const driver=location.hash.match(/^#?\/driver\/([^/]+)(?:\/([^/]+))?\/?$/),family=location.hash.match(/^#?\/lab\/([^/]+)\/?$/),lab=/^#?\/lab\/?$/.test(location.hash);
  try{
    if(driver){await loadCatalog();if(request!==ROUTE_REQUEST)return;await driverView(decodeURIComponent(driver[1]),driver[2]||'overview')}
    else if(family){await loadLab();if(request!==ROUTE_REQUEST)return;await labFamilyView(decodeURIComponent(family[1]))}
    else if(lab){await loadLab();if(request!==ROUTE_REQUEST)return;await labView()}
    else{await loadCatalog();if(request!==ROUTE_REQUEST)return;await catalogView()}
  }catch(e){if(request===ROUTE_REQUEST)$('#view').innerHTML=`<div class="empty"><b>Could not reach the Driver Engine register</b>The release channel or clean-room lab record is unavailable. Check the connection and reload this page.<div style="margin-top:14px"><a class="btn" href="${esc(location.href)}">Try again</a></div></div>`}
}
addEventListener('hashchange',route);route();
</script>
